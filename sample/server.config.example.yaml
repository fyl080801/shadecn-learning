# 服务端配置文件示例（docs/28 §3.3）。复制成 server.config.yaml（或 .yml / .json）后按需改，放在数据目录
# （默认 <应用根目录>/data，环境变量 DATA_DIR 可换；DATA_DIR 本身只能写在环境变量或 .env 里，不能写在这个文件里）。
#
# - 分层：server.config.<NODE_ENV>.yaml（production / development）叠在它上面，对象逐键合并、数组整个替换；
# - SERVER_CONFIG=a.yaml,b.yaml 显式指定文件（按顺序叠，相对路径按数据目录算，容器里指到挂进来的 ConfigMap），给了就不再自动找；
# - 环境变量（含 .env）优先于文件。**变量名由这个文件的结构推导**，不另外定义：路径每一级转大写、camelCase 拆词、下划线连接 ——
#   server.port → SERVER_PORT，cluster.redisUrl → CLUSTER_REDIS_URL，modules.agent.sandbox.k8s.apiUrl → MODULES_AGENT_SANDBOX_K8S_API_URL。
#   含义见 .env.example；
# - 写了 schema 里没有的键、或类型不对，启动直接失败并列出全部问题；
# - 密钥（sessionSecret、各 clientSecret、secretAccessKey）可以写在这里，但生产上应当走环境变量 / Secret；
# - 语言服务的 key 不进这个文件：llm.providers 的 apiKey 只认 "$环境变量名"，写明文启动失败；
# - llm.providers、modules.apps.providers、modules.apps.apps 是一整段结构化配置，对应的环境变量（LLM_PROVIDERS、MODULES_APPS_PROVIDERS、
#   MODULES_APPS_APPS）的值是同形的 JSON（设了就整段盖掉文件里的）；它们的 apiKey 都只认 "$环境变量名"，写明文启动失败。
#
# 下面都是可选项，不写 = 用默认值；只有 modules.apps 写的是实际内容（方舟的模型），$ARK_API_KEY 没设时这些应用只是不可用。

server:
  # port: 3000
  # host: 127.0.0.1
  # roles: [web, collab, agent]  # 不写 = 全部角色一个进程（docs/28 §3.2）
  # instanceId: web-1
  # staticDir: output/public
  # origin: https://canvas.example.com
  # origins:
  #   - https://canvas.example.com
  #   - https://canvas.internal.example.com

database:
  # provider: postgresql  # sqlite / postgresql
  # url: postgresql://user:pass@db:5432/shadecn

cluster:
  # mode: redis  # single / redis
  # redisUrl: redis://redis:6379
  # redisKeyPrefix: shadecn

log:
  # level: info
  # format: json  # pretty / json
  # dir: logs
  # http: api  # api / all / off
  # slowMs: 1000
  # slowQueryMs: 200

# 语言服务提供方（形状是 pi 的 models.json 的一个子集，docs/28 §3.3）：modules.agent.provider 引用这里的 id；
# 带 models 的提供方，每个模型自动成为一个 text 类应用（llm-<id>:<model>），画布的文本节点可以选它生成（docs/29 §3.8）。
# 提供方 id：小写字母开头，小写字母、数字、-，最长 48。
# 字段：name（显示名）、baseUrl（给了就是自建 / 代理端点）、api（openai-completions / anthropic-messages）、
# apiKey（只认 "$环境变量名"；不写 = 按提供方退回 ANTHROPIC_API_KEY 这类约定变量，ollama 不要 key）、models。
# 模型：id（必填）、name、input（默认按 pi 注册表，自建端点只吃文字）、reasoning、contextWindow、maxTokens。
# 不支持 pi 的 headers / compat / cost / modelOverrides / !command：写了就是不认识的字段，启动失败。
# llm:
#   providers:
#     # 本机 ollama（模型名照 ollama list）；地址就是默认值，别的机器上的 ollama 才要改
#     ollama:
#       name: 本机 ollama
#       baseUrl: http://127.0.0.1:11434/v1
#       api: openai-completions
#       models:
#         - id: deepseek-v4.1-flash:1017-cloud
#           name: DeepSeek V4.1 flash
#           input: [text, image]
#           reasoning: true
#           contextWindow: 128000
#           maxTokens: 8192
#         - id: qwen3
#     # OpenAI 兼容的自建端点
#     selfhost:
#       name: 自建模型服务
#       baseUrl: https://llm.example.com/v1
#       api: openai-completions
#       apiKey: $MY_LLM_API_KEY
#       models:
#         - id: qwen-max
#     # 内置提供方走代理：只换地址，模型照 pi 注册表（没有 models = 不成为 text 类应用，只给 agent 引用）
#     anthropic:
#       baseUrl: https://llm-proxy.example.com/anthropic

# 能力模块（模块清单 apps/server/modules.ts 里的每一个一节，键是模块名）。每节都有 enabled（如 modules.agent.enabled → MODULES_AGENT_ENABLED）：
# false 关掉（启动日志和 /api/features 写明原因；被别的模块硬依赖的关掉会启动失败）；true / 不写 = 由模块自己判（缺配置照样不开）
modules:
  auth:
    # enabled: true  # 登录、会话；canvas 硬依赖它，关不得
    # sessionSecret: change-me
    # sessionTtl: 604800  # 秒
    keycloak:
      # issuer: https://keycloak.example.com/realms/shadecn
      # clientId: shadecn
      # clientSecret: ""
      # scope: openid profile email
    github:
      # clientId: ""
      # clientSecret: ""
      # scope: read:user user:email
  canvas:
    # enabled: true  # 项目 / 画布；storage / collab / agent 都硬依赖它
  collab:
    # enabled: true  # agent 在执行角色上硬依赖它
  storage:
    # enabled: true
    # endpoint: https://s3.example.com
    # internalEndpoint: http://minio.minio.svc.cluster.local:9000
    # region: us-east-1
    # bucket: canvas
    # accessKeyId: ""
    # secretAccessKey: ""
    # maxUploadMb: 100
    # keyPrefix: canvas
  agent:
    # enabled: true
    # 引用上面 llm.providers 的 id（连接信息和模型能力都在那边）；那里没有就当 pi 的内置提供方，key 按提供方退回 ANTHROPIC_API_KEY 等环境变量
    # provider: anthropic
    # model: claude-sonnet-4-6
    # thinking: medium
    # titleModel: default  # off = 不生成
    # maxOutputTokens: 16384
    # modelsFile: data/agent-models.json
    # tokenSecret: ""
    # gatewayUrl: ""
    # grantMarginMs: 60000
    # leaseTtlMs: 30000
    # runIdleTimeoutMs: 120000
    # runTotalTimeoutMs: 1800000
    sandbox:
      # driver: process  # process / oci / k8s
      # exec: false
      # allowProcess: false
      # image: shadecn-agent-sandbox:latest
      # runtime: runsc
      # cpus: 1
      # memoryMib: 512
      # pids: 128
      # diskMib: 512
      oci:
        # socket: unix:///var/run/docker.sock
        # network: bridge
      k8s:
        # namespace: shadecn-agent-sandbox
        # runtimeClass: gvisor
        # pullSecret: ""
        # pullPolicy: IfNotPresent
        # nodeSelector:
        #   kubernetes.io/arch: arm64
        # apiUrl: ""
        # tokenFile: ""
        # caFile: ""
  apps:
    # enabled: true  # 不写 = 由模块自己判：一个应用都没有（下面的 apps 是空的，llm.providers 里也没有带模型的提供方）就关掉
    # timeoutMs: 600000  # 条目没写 timeoutMs 时一次执行的时限
    # 对接服务的实例（docs/29 §3.3）。同一种驱动可以有多个实例（两套 ComfyUI、两个方舟账号）。
    # 密钥只写 "$环境变量名"，值放 .env；变量为空 = 引用它的应用显示为不可用，不影响启动。
    providers:
      ark:
        type: ark
        apiKey: $ARK_API_KEY
      # comfy:
      #   type: comfyui
      #   baseUrl: http://127.0.0.1:8188
      # local:
      #   type: ollama
      # writer:  # 引用上面 llm.providers 里的提供方：地址、key、模型能力都在那边
      #   type: llm
      #   provider: selfhost
    # 应用：平铺的数组，每项 = 一个 provider + 一个 model（要多个模型就每个写一项，界面上是同一个下拉里的多个选项）。
    # 应用 id 自动生成：<provider>:<model>，不要模型的操作（ComfyUI）写 id，是 <provider>:<id>。
    # type 是类别：text / image / video / 3d / audio，提供方的驱动得能做这一类（方舟 image / video / 3d，ComfyUI 全部，语言服务 text）。
    # params 是这个模型和驱动基础表的差异：每一项是部分覆盖，null = 这个模型没有这个参数（传了报「不认识的参数」），新参数要写 type。
    # 驱动的基础表取各代的并集（最宽的上限），这里把每个模型收窄。上游出了新模型：加一项，不用改代码。
    #
    # 语言服务不用抄进这里：llm.providers 里带 models 的提供方，每个模型自动成为一个 text 类应用（llm-<提供方 id>:<model>），
    # 没有这一段也有。要带固定的 system、maxTokens 才手写，见最后的 writer。
    apps:
      # Seedream（火山方舟「图片生成 API」与 5.0 pro 页，2026-11 核对）。尺寸：档位（比例由模型按提示词定）或 宽x高，二者不能混用；
      # 宽x高的比例在 1/16～16 之间（驱动的基础表已带），像素总量按代不同；presets 是文档的常用宽高表，弹出框按它给「分辨率 × 比例」。
      - provider: ark
        model: doubao-seedream-5-0-pro-260628
        type: image
        title: Seedream 5.0 pro
        description: 文生图；连入参考图即图生图
        defaults: { size: 2K }
        params: # 参考图最多 10 张，暂不支持组图
          image: { maxLength: 10, description: "参考图（图生图），最多 10 张" }
          maxImages: null
          size:
            tiers: [1K, 1.5K, 2K]
            minPixels: 921600
            maxPixels: 4624220
            presets: # 比例 → 每档的宽x高（方舟文档的参考值；别的宽高在范围内也收）
              "1:1": [1024x1024, 1536x1536, 2048x2048]
              "4:3": [1152x864, 1792x1344, 2368x1776]
              "3:4": [864x1152, 1344x1792, 1776x2368]
              "16:9": [1424x800, 2048x1152, 2816x1584]
              "9:16": [800x1424, 1152x2048, 1584x2816]
              "3:2": [1248x832, 1872x1248, 2496x1664]
              "2:3": [832x1248, 1248x1872, 1664x2496]
              "21:9": [1568x672, 2352x1008, 3136x1344]
      - provider: ark
        model: doubao-seedream-5-0-flash-260915
        type: image
        title: Seedream 5.0 flash
        description: 文生图；连入参考图即图生图
        defaults: { size: 2K }
        params: # 参考图最多 10 张，暂不支持组图
          image: { maxLength: 10, description: "参考图（图生图），最多 10 张" }
          maxImages: null
          size:
            tiers: [1K, 1.5K, 2K]
            minPixels: 921600
            maxPixels: 4624220
            presets: # 比例 → 每档的宽x高（方舟文档的参考值；别的宽高在范围内也收）
              "1:1": [1024x1024, 1536x1536, 2048x2048]
              "4:3": [1152x864, 1792x1344, 2368x1776]
              "3:4": [864x1152, 1344x1792, 1776x2368]
              "16:9": [1424x800, 2048x1152, 2816x1584]
              "9:16": [800x1424, 1152x2048, 1584x2816]
              "3:2": [1248x832, 1872x1248, 2496x1664]
              "2:3": [832x1248, 1248x1872, 1664x2496]
              "21:9": [1568x672, 2352x1008, 3136x1344]
      # 下面几个模型的确切 id 方舟文档里没找到（参数是核对过的）：填上真实 model id 后取消注释。
      # - provider: ark
      #   model: doubao-seedream-5-0-lite-XXXXXX
      #   type: image
      #   title: Seedream 5.0 lite
      #   params:
      #     size:
      #       tiers: [2K, 3K, 4K]
      #       minPixels: 3686400
      #       maxPixels: 16777216
      #       presets:
      #         "1:1": [2048x2048, 3072x3072, 4096x4096]
      #         "4:3": [2304x1728, 3456x2592, 4704x3520]
      #         "3:4": [1728x2304, 2592x3456, 3520x4704]
      #         "16:9": [2848x1600, 4096x2304, 5504x3040]
      #         "9:16": [1600x2848, 2304x4096, 3040x5504]
      #         "3:2": [2496x1664, 3744x2496, 4992x3328]
      #         "2:3": [1664x2496, 2496x3744, 3328x4992]
      #         "21:9": [3136x1344, 4704x2016, 6240x2656]
      # - provider: ark
      #   model: doubao-seedream-4-5-XXXXXX
      #   type: image
      #   title: Seedream 4.5
      #   params:
      #     outputFormat: null
      #     size:
      #       tiers: [2K, 4K]
      #       minPixels: 3686400
      #       maxPixels: 16777216
      #       presets:
      #         "1:1": [2048x2048, 4096x4096]
      #         "4:3": [2304x1728, 4704x3520]
      #         "3:4": [1728x2304, 3520x4704]
      #         "16:9": [2848x1600, 5504x3040]
      #         "9:16": [1600x2848, 3040x5504]
      #         "3:2": [2496x1664, 4992x3328]
      #         "2:3": [1664x2496, 3328x4992]
      #         "21:9": [3136x1344, 6240x2656]
      # - provider: ark
      #   model: doubao-seedream-4-0-XXXXXX
      #   type: image
      #   title: Seedream 4.0
      #   params:
      #     outputFormat: null
      #     size:
      #       tiers: [1K, 2K, 4K]
      #       minPixels: 921600
      #       maxPixels: 16777216
      #       presets:
      #         "1:1": [1024x1024, 2048x2048, 4096x4096]
      #         "4:3": [1152x864, 2304x1728, 4704x3520]
      #         "3:4": [864x1152, 1728x2304, 3520x4704]
      #         "16:9": [1280x720, 2848x1600, 5504x3040]
      #         "9:16": [720x1280, 1600x2848, 3040x5504]
      #         "3:2": [1248x832, 2496x1664, 4992x3328]
      #         "2:3": [832x1248, 1664x2496, 3328x4992]
      #         "21:9": [1512x648, 3136x1344, 6240x2656]

      # Seedance（「创建视频生成任务」与各模型页，2026-11 核对；1.0 的首尾帧 / 参考图文档没写，按不支持处理）
      - provider: ark
        model: doubao-seedance-2-0-260128
        type: video
        title: Seedance 2.0
        timeoutMs: 900000
        params:
          duration: { max: 15 }
          referenceImages: { maxLength: 9 }
          seed: null
      - provider: ark
        model: doubao-seedance-2-0-fast-260128
        type: video
        title: Seedance 2.0 fast
        timeoutMs: 900000
        params:
          resolution: { enum: [480p, 720p] }
          duration: { max: 15 }
          referenceImages: { maxLength: 9 }
          seed: null
      - provider: ark
        model: doubao-seedance-1-0-pro-250528
        type: video
        title: Seedance 1.0 pro
        timeoutMs: 900000
        params:
          duration: { min: 2, max: 12 }
          lastFrame: null
          referenceImages: null
          generateAudio: null
      # 同样缺确切 id：填上真实 model id 后取消注释。
      # - provider: ark
      #   model: doubao-seedance-2-5-XXXXXX
      #   type: video
      #   title: Seedance 2.5
      #   timeoutMs: 900000
      #   params:
