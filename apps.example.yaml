# 应用表示例（docs/29 §3.3）。复制到 data/apps.yaml（APPS_FILE 的默认位置，不进仓库）再按需删改。
# 密钥只写 "$环境变量名"，值放 .env；变量为空 = 引用它的应用显示为不可用，不影响启动。
# 这份文件被 packages/mod-apps/test/example.test.ts 解析：写错了测试会红。

# ── 模型档案：各代模型的参数差异 ─────────────────────────────────────────────
# key 是模型 id 或以 * 结尾的前缀；按顺序取第一条匹配的，所以更具体的写在前面。
# params 里每一项是对驱动基础参数的部分覆盖；null = 这个模型没有这个参数（传了会报「不认识的参数」）。
# 驱动的基础参数表取各代的并集（最宽的上限），这里把每一代收窄。上游出了新模型：在这里加一条，不用改代码。
models:
  # Seedream（火山方舟「图片生成 API」与 5.0 pro 页，2026-11 核对）。尺寸：档位（比例由模型按提示词定）或 宽x高，二者不能混用；
  # 宽x高的比例在 1/16～16 之间（驱动的基础表已带），像素总量按代不同；presets 是文档的常用宽高表，弹出框按它给「分辨率 × 比例」
  doubao-seedream-5-0-lite*:
    title: Seedream 5.0 lite
    params:
      size:
        tiers: [2K, 3K, 4K]
        minPixels: 3686400
        maxPixels: 16777216
        presets: # 比例 → 每档的宽x高（方舟文档的参考值；别的宽高在范围内也收）
          "1:1": [2048x2048, 3072x3072, 4096x4096]
          "4:3": [2304x1728, 3456x2592, 4704x3520]
          "3:4": [1728x2304, 2592x3456, 3520x4704]
          "16:9": [2848x1600, 4096x2304, 5504x3040]
          "9:16": [1600x2848, 2304x4096, 3040x5504]
          "3:2": [2496x1664, 3744x2496, 4992x3328]
          "2:3": [1664x2496, 2496x3744, 3328x4992]
          "21:9": [3136x1344, 4704x2016, 6240x2656]
  doubao-seedream-5-0*: # pro / flash：参考图最多 10 张，暂不支持组图
    title: Seedream 5.0
    params:
      image: { maxLength: 10, description: "参考图（图生图），最多 10 张" }
      maxImages: null
      size:
        tiers: [1K, 1.5K, 2K]
        minPixels: 921600
        maxPixels: 4624220
        presets: # 比例 → 每档的宽x高（方舟文档的参考值；别的宽高在范围内也收）
          "1:1": [1024x1024, 1536x1536, 2048x2048]
          "4:3": [1152x864, 1792x1344, 2368x1776]
          "3:4": [864x1152, 1344x1792, 1776x2368]
          "16:9": [1424x800, 2048x1152, 2816x1584]
          "9:16": [800x1424, 1152x2048, 1584x2816]
          "3:2": [1248x832, 1872x1248, 2496x1664]
          "2:3": [832x1248, 1248x1872, 1664x2496]
          "21:9": [1568x672, 2352x1008, 3136x1344]
  doubao-seedream-4-5*:
    title: Seedream 4.5
    params:
      outputFormat: null
      size:
        tiers: [2K, 4K]
        minPixels: 3686400
        maxPixels: 16777216
        presets: # 比例 → 每档的宽x高（方舟文档的参考值；别的宽高在范围内也收）
          "1:1": [2048x2048, 4096x4096]
          "4:3": [2304x1728, 4704x3520]
          "3:4": [1728x2304, 3520x4704]
          "16:9": [2848x1600, 5504x3040]
          "9:16": [1600x2848, 3040x5504]
          "3:2": [2496x1664, 4992x3328]
          "2:3": [1664x2496, 3328x4992]
          "21:9": [3136x1344, 6240x2656]
  doubao-seedream-4-0*:
    title: Seedream 4.0
    params:
      outputFormat: null
      size:
        tiers: [1K, 2K, 4K]
        minPixels: 921600
        maxPixels: 16777216
        presets: # 比例 → 每档的宽x高（方舟文档的参考值；别的宽高在范围内也收）
          "1:1": [1024x1024, 2048x2048, 4096x4096]
          "4:3": [1152x864, 2304x1728, 4704x3520]
          "3:4": [864x1152, 1728x2304, 3520x4704]
          "16:9": [1280x720, 2848x1600, 5504x3040]
          "9:16": [720x1280, 1600x2848, 3040x5504]
          "3:2": [1248x832, 2496x1664, 4992x3328]
          "2:3": [832x1248, 1664x2496, 3328x4992]
          "21:9": [1512x648, 3136x1344, 6240x2656]

  # Seedance（「创建视频生成任务」与各模型页，2026-11 核对；1.0 的首尾帧 / 参考图文档没写，按不支持处理）
  doubao-seedance-2-5*:
    title: Seedance 2.5
    params:
      resolution: { enum: [480p, 720p, 1080p] }
      seed: null
  doubao-seedance-2-0-fast*:
    title: Seedance 2.0 fast
    params:
      resolution: { enum: [480p, 720p] }
      duration: { max: 15 }
      referenceImages: { maxLength: 9 }
      seed: null
  doubao-seedance-2-0-mini*:
    title: Seedance 2.0 mini
    params:
      resolution: { enum: [480p, 720p] }
      duration: { max: 15 }
      referenceImages: { maxLength: 9 }
      seed: null
  doubao-seedance-2-0*:
    title: Seedance 2.0
    params:
      duration: { max: 15 }
      referenceImages: { maxLength: 9 }
      seed: null
  doubao-seedance-1-0*:
    title: Seedance 1.0
    params:
      duration: { min: 2, max: 12 }
      lastFrame: null
      referenceImages: null
      generateAudio: null

  doubao-seed3d*:
    title: Seed3D

# ── 对接服务的实例 ───────────────────────────────────────────────────────────
providers:
  ark:
    type: ark
    apiKey: $ARK_API_KEY
  # comfy:
  #   type: comfyui
  #   baseUrl: http://127.0.0.1:8188
  # local:
  #   type: ollama

# ── 应用 ─────────────────────────────────────────────────────────────────────
apps:
  seedream:
    title: Seedream 生图
    description: 文生图；连入参考图即图生图
    provider: ark
    operation: image
    # 多个模型 = 调用方可选（参数 model），第一个可用的是默认
    model: [doubao-seedream-5-0-pro-260628, doubao-seedream-5-0-flash-260915]
    defaults:
      size: 2K

  seedance:
    title: Seedance 生视频
    provider: ark
    operation: video
    model: [doubao-seedance-2-0-260128, doubao-seedance-2-0-fast-260128, doubao-seedance-1-0-pro-250528]
    timeoutMs: 900000

  seed3d:
    title: Seed3D 图生 3D
    provider: ark
    operation: 3d
    model: doubao-seed3d-2-0-260328

