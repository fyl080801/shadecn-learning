# Argo Workflows 流水线定义：clone → 构建服务端 + agent 沙箱两个镜像推 Harbor（默认只 arm64）→ 把新镜像 tag 写回 git。
#
# 这个文件不在 k8s/ 下面，是故意的：ArgoCD 的 Application 只同步 k8s/ 目录，而且开了
# prune + selfHeal —— 流水线定义放进去会被它纳管，以后误删文件就会连集群里的模板一起
# prune 掉。它由人手动 apply，不进 GitOps 环：
#
#   kubectl apply -f ci/workflow-template.yaml
#
# 改完记得 apply，否则仓库和集群会不一致（集群里的那份才是实际生效的）。
#
# 跑一次（默认构建 master，见下面的 gitRevision）：
#
#   kubectl -n devops create -f ci/run.yaml
#
# 提交 Workflow 时要带 nodeSelector kubernetes.io/arch=arm64（ci/run.yaml 和 .gitea/workflows/cicd.yaml 里都写好了）：
# 默认只构建 linux/arm64（platforms 参数），在 arm64 节点上原生跑，不靠 QEMU。
#
# 依赖这些带外资源（都不在仓库里，缺一个流水线就跑不起来）：
#   - Secret dev/gitea-deploy-key   —— key: id_ed25519，gitea 上要配成有写权限的 deploy key
#                                      （最后一步要 push 回同一个分支）
#   - Secret dev/harbor-auth        —— key: username / password
#   - Secret dev/harbor-ca-cert     —— key: ca.crt，Harbor 的自签 CA
#   - ConfigMap dev/workflow-proxy-config —— HTTP_PROXY / HTTPS_PROXY / NO_PROXY，optional
#                                      （构建要拉墙外的 npm 包，没有它多半会超时）
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: shadecn-learning-cicd
  namespace: devops
spec:
  entrypoint: main
  # 各步之间传源码用的 artifact 落在 minio 上，Workflow 删掉时一并回收，
  # 否则 bucket 里会一直积攒每轮构建的整份 workspace。
  # （集群里早就是这个值了，只是一直没写回仓库 —— docs/12 §5 那条
  #   `kubectl diff -f ci/workflow-template.yaml` 无输出的验收项因此一直不成立）
  artifactGC:
    strategy: OnWorkflowDeletion
  arguments:
    parameters:
      # CI 认的是 gitea，不是 github 上那个 origin
      - name: gitRepo
        value: ssh://git@git.fyl080801.uk:30222/admin/shadecn-learning.git
      # 提交 Workflow 时覆盖它就能构建任意分支
      - name: gitRevision
        value: master
      # Harbor 的对外地址；构建时会被换成集群内的 harbor-core.harbor.svc
      - name: imageName
        value: 192.168.68.95:31443/apps/shadecn-learning
      # 画布 agent 的沙箱镜像（docs/22 §7.5），和服务端同一个 tag。k8s/deployment.yaml 的 AGENT_SANDBOX_IMAGE、
      # k8s/variants/agent-sandbox-vap.yaml 的镜像规则都认这个名字，改名三处一起改
      - name: sandboxImageName
        value: 192.168.68.95:31443/apps/shadecn-agent-sandbox
      # 构建哪些架构，逗号分隔（linux/amd64、linux/arm64）。只写 Workflow 落的那种节点的原生架构最快；
      # 多写的那种靠 QEMU（产物只构建一次，QEMU 下只跑 npm install / apk add 和自检）。
      # 改了它，k8s/deployment.yaml 里服务端和沙箱的 nodeSelector 要跟着改，否则 Pod 会落到拉不到镜像的节点上
      - name: platforms
        value: linux/arm64
      # 三个构建阶段的基础镜像。Dockerfile 里是 `ARG NODE_IMAGE`，不写死地址。
      #
      # 指的是 Harbor **普通项目**里自存的一份多架构副本，不是 `docker.io/` 那个代理缓存 ——
      # 代理缓存会间歇性地抽风：坏窗口里按 tag 拉会拿到一份**缺 amd64 的 index**
      # （`no image found in image index for architecture "amd64"`），按 index digest 拉
      # 直接 `not found`，也就是那一刻它本地根本没有这个 artifact。同一个节点、同一个
      # buildah、同一个引用，几分钟内成功和失败来回翻；匿名 / 已登录、pull / bud、
      # tag / digest 全都试过，与这些都无关。一轮构建二十多分钟、要在六个 FROM 上各拉
      # 一次，撞上是必然 —— 实测连挂五次，其中一次 amd64 整轮跑完、arm64 刚开头挂掉。
      #
      # 副本是这么来的（换 node 版本时照做一次，然后改下面这行）：
      #   buildah manifest create nodebase
      #   buildah manifest add --all nodebase docker://docker.io/library/node:22-alpine
      #   buildah manifest push --all nodebase docker://harbor-core.harbor.svc/apps/node:22-alpine
      # 第二步走 xproxy 直接到 docker.io（HTTPS_PROXY 来自 workflow-proxy-config），
      # 绕开代理缓存。推完确认 index 里 amd64 / arm64 都在再改这行。
      - name: baseImage
        value: 192.168.68.95:31443/apps/node:22-alpine
      - name: harborAuthSecret
        value: harbor-auth
      - name: harborCaSecret
        value: harbor-ca-cert
      # 下面两个目前没有模板在用，留着是给「构建完直接 kubectl set image」那条路的；
      # 现在走 GitOps（改 tag 推回 git，ArgoCD 负责部署），所以用不上
      - name: k8sNamespace
        value: dev
      - name: deploymentName
        value: shadecn-learning
  # ⚠️ Argo 自己的 executor（每个步骤 Pod 的 init + wait 容器）默认从 quay.io 直连拉，
  # 而 controller 的 configmap 里 executor 是 `imagePullPolicy: Always` —— 节点上缓存过
  # 也没用，quay.io 一不通，每个步骤都卡在 Init:ImagePullBackOff（"failed to do request:
  # Head https://quay.io/v2/... : EOF"），流水线一步都跑不动。ConfigMap 里的
  # `workflow-proxy-config` 救不了：那是注入到容器里的 env，而拉镜像的是 kubelet。
  # 所以这里把 executor 也改指到 Harbor 的 quay.io 代理缓存上。
  # 镜像 tag 必须与集群里 argo 的版本一致（`kubectl -n argo get deploy` 看
  # workflow-controller 的 tag），argo 升级后要跟着改。
  podSpecPatch: |
    initContainers:
      - name: init
        image: 192.168.68.95:31443/quay.io/argoproj/argoexec:v3.7.9
    containers:
      - name: wait
        image: 192.168.68.95:31443/quay.io/argoproj/argoexec:v3.7.9
  imagePullSecrets:
    - name: harbor-pull-secret
  templates:
    # 三步串行。镜像 tag 一律取 clone 出来的提交短 hash，两个镜像、构建和写回用的都是同一个值
    - name: main
      steps:
        - - name: clone
            template: git-clone
        - - name: build-and-push
            template: buildah-build-push
            arguments:
              artifacts:
                - name: source
                  from: '{{steps.clone.outputs.artifacts.source}}'
              parameters:
                - name: imageTag
                  value: '{{steps.clone.outputs.parameters.commit-short}}'
        - - name: update-image-tag
            template: git-update-image-tag
            arguments:
              artifacts:
                - name: source
                  from: '{{steps.clone.outputs.artifacts.source}}'
              parameters:
                - name: imageTag
                  value: '{{steps.clone.outputs.parameters.commit-short}}'

    - name: git-clone
      container:
        image: 192.168.68.95:31443/docker.io/alpine/git:latest
        command:
          - sh
          - -c
        args:
          - |
            set -e
            mkdir -p /root/.ssh
            cp /ssh-key/id_ed25519 /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            ssh-keyscan -p 30222 git.fyl080801.uk >> /root/.ssh/known_hosts 2>/dev/null
            REVISION="{{workflow.parameters.gitRevision}}"
            echo "Cloning {{workflow.parameters.gitRepo}} ..."
            GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/.ssh/known_hosts" git clone {{workflow.parameters.gitRepo}} /workspace
            cd /workspace
            git checkout $REVISION
            git log -1 --oneline
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            echo -n "$COMMIT_SHORT" > /tmp/git-commit-short
            echo -n "$(git rev-parse HEAD)" > /tmp/git-commit-full
        volumeMounts:
          - name: ssh-key
            mountPath: /ssh-key
            readOnly: true
      envFrom:
        - configMapRef:
            name: workflow-proxy-config
            optional: true
      outputs:
        # 整个工作区作为 artifact 传给后面两步（走 dev/artifact-repositories 里配的 minio）
        artifacts:
          - name: source
            path: /workspace
        parameters:
          - name: commit-full
            valueFrom:
              path: /tmp/git-commit-full
          - name: commit-short
            valueFrom:
              path: /tmp/git-commit-short
      volumes:
        - name: ssh-key
          secret:
            secretName: gitea-deploy-key

    # 一次构建出两个镜像推 Harbor：服务端 apps/shadecn-learning:<sha> 和 agent 沙箱 apps/shadecn-agent-sandbox:<sha>
    # （同一次 pnpm build：服务端和沙箱里的 runner 是同一个构建 id，协议版本必然一致）。
    # 只构建 platforms 参数里的架构，默认只有 linux/arm64，Workflow 由 nodeSelector 钉在 arm64 节点上原生跑（不靠 QEMU）。
    #
    # 三段：
    #   1. 根 Dockerfile 的 `artifacts` 阶段（= build 阶段：pnpm install + pnpm build）导出到本地目录 —— 最重的一段只跑一次，
    #      和要构建几个镜像、几个架构都无关（build 阶段本来就是 $BUILDPLATFORM，产物与架构无关）；
    #   2. 每个 platform：用产物里的 output/Dockerfile（= apps/server/scripts/output-image/Dockerfile，docs/12 §2.4 的
    #      「直接基于产物打镜像」）构建服务端镜像，用 agent-sandbox/Dockerfile 构建沙箱镜像；
    #   3. 两个 manifest 都核对过架构再推。任何一段失败整步失败，下一步就不会把 tag 写回 git。
    # 三道架构护栏都还在：所有 FROM 用同一个多架构的 baseImage；output/Dockerfile 和沙箱 Dockerfile 每个阶段都比对 TARGETARCH；
    # 服务端镜像的运行时阶段逐个加载原生模块。详见 docs/12 §2.5.1。
    - name: buildah-build-push
      inputs:
        artifacts:
          - name: source
            path: /workspace
        parameters:
          - name: imageTag
      workingDir: /workspace
      container:
        # 同样走 Harbor 的 quay.io 代理缓存，别直连 quay.io（见 spec.podSpecPatch 的注释）
        image: 192.168.68.95:31443/quay.io/buildah/stable:latest
        command:
          - bash
          - -c
        args:
          - |
            set -euo pipefail
            COMMIT_ID="{{inputs.parameters.imageTag}}"
            # 单个构建最多试几次、每次之间等多久（见下面 retry 的注释）
            BUILD_ATTEMPTS=4
            BUILD_RETRY_DELAY=90
            BASE_IMAGE="{{workflow.parameters.baseImage}}"
            APP_IMAGE={{workflow.parameters.imageName}}:${COMMIT_ID}
            SANDBOX_IMAGE={{workflow.parameters.sandboxImageName}}:${COMMIT_ID}
            # 推送走集群内地址
            to_internal() { echo "$1" | sed "s|192.168.68.95:31443|harbor-core.harbor.svc|"; }
            APP_INTERNAL=$(to_internal ${APP_IMAGE})
            SANDBOX_INTERNAL=$(to_internal ${SANDBOX_IMAGE})
            INTERNAL_REGISTRY=$(echo ${APP_INTERNAL} | cut -d/ -f1)
            ARTIFACTS=/tmp/artifacts

            # platforms：逗号分隔，只认 linux/amd64、linux/arm64。不是这台节点原生架构的那几个要靠 QEMU，慢很多
            PLATFORMS=()
            for p in $(echo "{{workflow.parameters.platforms}}" | tr ',' ' '); do
              case "$p" in
                linux/amd64|linux/arm64) PLATFORMS+=("$p") ;;
                *) echo "!!! platforms 里有不认识的「${p}」（只认 linux/amd64、linux/arm64，逗号分隔）"; exit 1 ;;
              esac
            done
            if [ ${#PLATFORMS[@]} -eq 0 ]; then echo "!!! platforms 是空的"; exit 1; fi
            case "$(uname -m)" in
              x86_64) NATIVE=linux/amd64 ;;
              aarch64) NATIVE=linux/arm64 ;;
              *) NATIVE="linux/$(uname -m)" ;;
            esac
            echo "=== 构建节点 ${NATIVE}，目标 ${PLATFORMS[*]} ==="
            for p in "${PLATFORMS[@]}"; do
              [ "$p" = "$NATIVE" ] || echo "--- 注意：${p} 不是这台节点的原生架构，靠 QEMU 模拟（检查 Workflow 的 nodeSelector）"
            done

            # Read proxy settings from env
            PROXY_ARGS=""
            if [ -n "${HTTP_PROXY:-}" ]; then
              PROXY_ARGS="$PROXY_ARGS --build-arg HTTP_PROXY=$HTTP_PROXY"
            fi
            if [ -n "${HTTPS_PROXY:-}" ]; then
              PROXY_ARGS="$PROXY_ARGS --build-arg HTTPS_PROXY=$HTTPS_PROXY"
            fi
            if [ -n "${NO_PROXY:-}" ]; then
              PROXY_ARGS="$PROXY_ARGS --build-arg NO_PROXY=$NO_PROXY"
            fi

            # 拉基础镜像会**间歇性**失败，报
            # `no image found in image index for architecture "amd64"`：Harbor 的 docker.io
            # 代理缓存在补齐多架构 index 的过程中，会把一份缺架构的 index 发出来。
            # 实测同一个节点、同一个 buildah、同一个引用，几分钟之内成功和失败会来回翻
            # （匿名 / 已登录、buildah pull / bud、tag / digest 都试过，与这些都无关；
            # Harbor 各组件的出网代理也都配着，直连 docker.io 超时、走代理正常）。
            # 一轮要在好几个 FROM 上各拉一次，撞上坏窗口几乎是必然，
            # 所以这里每个构建自己重试 —— 失败的是拉镜像，重来一次就好，不用重跑整条流水线。
            retry() {
              local what=$1
              shift
              local attempt=1
              while true; do
                echo "=== ${what}（第 ${attempt} 次）==="
                if "$@"; then
                  return 0
                fi
                if [ ${attempt} -ge ${BUILD_ATTEMPTS} ]; then
                  echo "!!! ${what} 连续 ${BUILD_ATTEMPTS} 次都没成功，放弃"
                  return 1
                fi
                attempt=$((attempt + 1))
                echo "--- ${what} 失败，${BUILD_RETRY_DELAY}s 后重试 ---"
                sleep ${BUILD_RETRY_DELAY}
              done
            }

            # 每次 bud 都带 --pull=always --no-cache --layers=false：几轮共用一个本地存储，
            # 这几个开关保证每轮都按各自的 platform 重新拉基础镜像、不复用别的轮次的层。
            # 真正咬人的那个坑不在这里，在 Dockerfile：基础镜像的 tag 只要是单架构的，--platform 就只能退而拉它有的那个架构，
            # 而构建机装了 QEMU binfmt，于是整轮构建「跑得起来」、一步不报错，最后把错架构的 better_sqlite3.node
            # 打进标着另一个架构的镜像推上线。三道防线都在 Dockerfile 里（docs/12 §2.5.1）。
            build_artifacts() {
              rm -rf ${ARTIFACTS}
              buildah bud --pull=always --no-cache --layers=false \
                --file /workspace/Dockerfile --target artifacts \
                --build-arg NODE_IMAGE=${BASE_IMAGE} \
                $PROXY_ARGS \
                --output type=local,dest=${ARTIFACTS} \
                /workspace
            }
            build_image() {
              local PLATFORM=$1 MANIFEST=$2 CONTEXT=$3
              buildah bud --platform ${PLATFORM} --format docker \
                --pull=always --no-cache --layers=false \
                --file ${CONTEXT}/Dockerfile \
                --build-arg NODE_IMAGE=${BASE_IMAGE} \
                --manifest ${MANIFEST} \
                $PROXY_ARGS \
                ${CONTEXT}
            }
            # manifest 里必须恰好是要的那几个架构（少了 = 某一轮没加进去；只是打日志的 inspect 看不出来）
            check_manifest() {
              local MANIFEST=$1
              echo "=== ${MANIFEST} ==="
              # 脚本开头是 set -euo pipefail，grep 没命中会让整步失败 —— 这只是打日志，兜住
              buildah manifest inspect ${MANIFEST} | grep -E '"(architecture|os|digest)"' || true
              local have
              have=$(buildah manifest inspect ${MANIFEST} | grep -oE '"architecture": *"[^"]+"' | sed -E 's/.*"([^"]+)"$/\1/' | sort | tr '\n' ' ')
              local want
              want=$(for p in "${PLATFORMS[@]}"; do echo "${p#linux/}"; done | sort | tr '\n' ' ')
              if [ "${have}" != "${want}" ]; then
                echo "!!! ${MANIFEST} 里的架构是「${have}」，要的是「${want}」"
                return 1
              fi
            }

            retry "构建产物（根 Dockerfile 的 artifacts 阶段）" build_artifacts
            ls -la ${ARTIFACTS}/output ${ARTIFACTS}/agent-sandbox
            test -f ${ARTIFACTS}/output/Dockerfile
            test -f ${ARTIFACTS}/agent-sandbox/Dockerfile

            echo "=== Creating manifests ==="
            buildah manifest create ${APP_INTERNAL}
            buildah manifest create ${SANDBOX_INTERNAL}
            for PLATFORM in "${PLATFORMS[@]}"; do
              retry "服务端镜像 ${PLATFORM}" build_image ${PLATFORM} ${APP_INTERNAL} ${ARTIFACTS}/output
              retry "沙箱镜像 ${PLATFORM}" build_image ${PLATFORM} ${SANDBOX_INTERNAL} ${ARTIFACTS}/agent-sandbox
            done
            echo "=== Manifest contents ==="
            check_manifest ${APP_INTERNAL}
            check_manifest ${SANDBOX_INTERNAL}
            echo "=== Logging in to Harbor ==="
            echo "${PASS}" | buildah login --username="${USER}" --password-stdin ${INTERNAL_REGISTRY} || true
            # 先推沙箱：服务端镜像是「可以部署了」的那个信号，最后推
            echo "=== Pushing manifests to Harbor ==="
            buildah manifest push --all ${SANDBOX_INTERNAL} docker://${SANDBOX_INTERNAL}
            buildah manifest push --all ${APP_INTERNAL} docker://${APP_INTERNAL}
            buildah logout ${INTERNAL_REGISTRY} || true
            echo "=== Done: ${APP_IMAGE} + ${SANDBOX_IMAGE} ==="
        # 只在这一步配资源：pnpm build 里的 vue-tsc / vite build 吃内存，以前不设上限、在内存吃紧的节点上被
        # 内核 OOM 杀掉（exit 137）。requests 让调度器只把它放到有余量的节点上；limits 给足但封顶，
        # vfs 存储（每一层都是完整拷贝）吃的是节点磁盘，ephemeral-storage 一并限住。
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "6"
            memory: 12Gi
            ephemeral-storage: 60Gi
        env:
          # 容器里套容器，overlayfs 用不了，只能退到 vfs
          - name: STORAGE_DRIVER
            value: vfs
          - name: USER
            valueFrom:
              secretKeyRef:
                name: '{{workflow.parameters.harborAuthSecret}}'
                key: username
          - name: PASS
            valueFrom:
              secretKeyRef:
                name: '{{workflow.parameters.harborAuthSecret}}'
                key: password
        envFrom:
          - configMapRef:
              name: workflow-proxy-config
              optional: true
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
          # Harbor 是自签证书，两个路径都挂上：一个给 buildah 直接读，一个给系统 CA 信任链
          - name: harbor-ca
            mountPath: /etc/pki/tls/certs/harbor.crt
            subPath: ca.crt
            readOnly: true
          - name: harbor-ca
            mountPath: /etc/pki/ca-trust/source/anchors/harbor.crt
            subPath: ca.crt
            readOnly: true
      volumes:
        - name: harbor-ca
          secret:
            secretName: '{{workflow.parameters.harborCaSecret}}'

    # GitOps 的交接点：把 k8s/deployment.yaml 里的 tag 改成刚构建出来的那个，提交并 push 回
    # 同一个分支。之后就不管了 —— ArgoCD 轮询到这个提交，由它把新镜像部署上去。
    # 只改两行：服务端容器的 `image: <imageName>:<tag>` 和沙箱的 `value: <sandboxImageName>:<tag>`（AGENT_SANDBOX_IMAGE）。
    # 改出别的行就失败、不提交（防自触发循环的 paths-ignore 认的是「这个提交只动 k8s/」）。
    - name: git-update-image-tag
      inputs:
        artifacts:
          - name: source
            path: /workspace
        parameters:
          - name: imageTag
      container:
        image: 192.168.68.95:31443/docker.io/alpine/git:latest
        command:
          - sh
          - -c
        args:
          - |
            set -e
            IMAGE_TAG="{{inputs.parameters.imageTag}}"
            IMAGE_NAME="{{workflow.parameters.imageName}}"
            SANDBOX_IMAGE_NAME="{{workflow.parameters.sandboxImageName}}"
            BRANCH="{{workflow.parameters.gitRevision}}"
            # push 被拒之后最多再试几次、每次之间等多久（见下面循环体的注释）
            PUSH_ATTEMPTS=5
            PUSH_RETRY_DELAY=5
            echo "=== Updating image tag to ${IMAGE_TAG} ==="
            cd /workspace
            grep -q "value: ${SANDBOX_IMAGE_NAME}:" k8s/deployment.yaml \
              || echo "--- 注意：k8s/deployment.yaml 里没有沙箱镜像那一行（AGENT_SANDBOX_IMAGE），只改服务端镜像"
            sed -i \
              -e "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" \
              -e "s|value: ${SANDBOX_IMAGE_NAME}:.*|value: ${SANDBOX_IMAGE_NAME}:${IMAGE_TAG}|" \
              k8s/deployment.yaml
            git config user.email "cicd@shadecn-learning.local"
            git config user.name "CI/CD Pipeline"
            git add k8s/deployment.yaml
            # 要提交的只许是这一个文件里的上面那两种行：多出来的改动（比如 sed 的模式命中了注释）一旦推上去，
            # ArgoCD 就会把它同步到线上。看的是暂存区，工作区里别的东西本来就不会被提交
            UNEXPECTED_FILES=$(git diff --cached --name-only | grep -vx 'k8s/deployment.yaml' || true)
            UNEXPECTED_LINES=$(git diff --cached -U0 -- k8s/deployment.yaml | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
              | grep -vE "^[-+][[:space:]]*(image: ${IMAGE_NAME}|value: ${SANDBOX_IMAGE_NAME}):" || true)
            if [ -n "${UNEXPECTED_FILES}${UNEXPECTED_LINES}" ]; then
              echo "!!! 写回 tag 改到了不该改的地方，不提交："
              echo "${UNEXPECTED_FILES}"
              echo "${UNEXPECTED_LINES}"
              exit 1
            fi
            git commit -m "ci: update image tag to ${IMAGE_TAG}" || echo "No changes to commit"
            mkdir -p /root/.ssh
            cp /ssh-key/id_ed25519 /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            ssh-keyscan -p 30222 git.fyl080801.uk >> /root/.ssh/known_hosts 2>/dev/null
            # fetch / rebase 也要走这把 key，所以 export，而不是只挂在 push 那一条命令前面
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/.ssh/known_hosts"

            # clone 停在构建开始的那个提交，而一轮构建要 45 分钟 —— 这期间有人往同一分支
            # 推了新提交的话，这里就是 non-fast-forward，push 直接被拒。镜像其实已经推到
            # Harbor 了，只差这一行 tag 没写回，却要整条流水线重跑 45 分钟。
            # push 到 gitea 的自动触发上线之后，这个窗口撞得更频繁（每次 push 都会起一轮）。
            # 所以被拒就 fetch + rebase 重来：我们只动了 k8s/deployment.yaml 里的一行 tag，
            # 除非对方也改了同一行，否则不冲突。
            # 冲突**不要**用 -X ours 之类硬盖过去 —— 那意味着有人手工改过 image tag（比如回滚），
            # 悄悄盖掉比失败糟得多，所以让它红在这里、由人来看。
            attempt=1
            while true; do
              if git push origin HEAD:${BRANCH}; then
                break
              fi
              if [ ${attempt} -ge ${PUSH_ATTEMPTS} ]; then
                echo "!!! push 连续 ${PUSH_ATTEMPTS} 次被拒，放弃（镜像已在 Harbor，只是 tag 没写回；"
                echo "    重跑一次流水线即可，不必重新构建镜像之外的东西）"
                exit 1
              fi
              echo "--- 第 ${attempt} 次 push 被拒，多半是构建期间分支上有了新提交；fetch + rebase 后重试 ---"
              # gitRevision 传的是 tag 或 commit 时根本没有可 rebase 的分支，别在这兜圈子
              git fetch origin "${BRANCH}" || {
                echo "!!! 取不到 origin/${BRANCH}（gitRevision 可能不是分支），不重试"
                exit 1
              }
              git rebase FETCH_HEAD || {
                echo "!!! rebase 冲突：有人手工改过 k8s/deployment.yaml 的 image 行，需要人工处理"
                exit 1
              }
              attempt=$((attempt + 1))
              sleep ${PUSH_RETRY_DELAY}
            done
            echo "=== Image tag updated to ${IMAGE_TAG} ==="
        volumeMounts:
          - name: ssh-key
            mountPath: /ssh-key
            readOnly: true
      envFrom:
        - configMapRef:
            name: workflow-proxy-config
            optional: true
      volumes:
        - name: ssh-key
          secret:
            secretName: gitea-deploy-key
