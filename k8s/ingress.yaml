apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadecn-learning
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01-cloudflare
    # /ws/* 上的 Yjs 长连接：默认 60s 读超时会把闲置的协作连接掐掉
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.fyl080801.uk
      secretName: shadecn-learning-tls
  rules:
    - host: demo.fyl080801.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shadecn-learning
                port:
                  number: 80
