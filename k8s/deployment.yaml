apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadecn-learning
  namespace: dev
  labels:
    app: shadecn-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shadecn-learning
  template:
    metadata:
      labels:
        app: shadecn-learning
    spec:
      containers:
        - name: shadecn-learning
          image: 192.168.68.95:31443/apps/shadecn-learning:0135b73
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
      imagePullSecrets:
        - name: harbor-pull-secret