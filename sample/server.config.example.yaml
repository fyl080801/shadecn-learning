      #   params:
      #     resolution: { enum: [480p, 720p] }
      #     duration: { max: 15 }
      #     referenceImages: { maxLength: 9 }
      #     seed: null

      - provider: ark
        model: doubao-seed3d-2-0-260328
        type: 3d
        title: Seed3D 2.0

      # ComfyUI 不写 model，写 id：模型在工作流里，要选就把 ckpt_name 映射成带 enum 的参数
      # - provider: comfy
      #   id: sdxl
