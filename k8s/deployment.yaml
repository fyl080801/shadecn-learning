apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shadecn-learning-data
  namespace: dev
spec:
  # 集群里 local-path 和 nfs-homenas 都标了 default，必须显式指定
  storageClassName: nfs-homenas
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 注意：Secret 故意不放在 git 里（ArgoCD 开了 selfHeal，会拿仓库里的占位值把真值刷掉）。
# 它是带外创建的，用 .env 里的值：
#   set -a; . ./.env; set +a
#   kubectl -n dev create secret generic shadecn-learning-auth \
#     --from-literal=KEYCLOAK_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" \
#     --from-literal=SESSION_SECRET="$SESSION_SECRET" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 要开 GitHub 登录就再加这两行（下面的 envFrom 是整份 Secret 注入，
# 所以只要键在 Secret 里就生效，Deployment 本身不用改）：
#     --from-literal=GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID" \
#     --from-literal=GITHUB_CLIENT_SECRET="$GITHUB_CLIENT_SECRET" \
# GitHub OAuth App 的回调填 $APP_ORIGIN/api/auth/callback —— 和 Keycloak 共用同一个。
# 画布资源上传（S3）和画布 agent 的模型配置不在这个 Secret 里：各有一对带外的 ConfigMap + Secret
# （shadecn-learning-s3、shadecn-learning-agent），见下面 envFrom 的注释和 docs/12 §3.3。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadecn-learning
  namespace: dev
  labels:
    app: shadecn-learning
spec:
  # SQLite 单文件 + 内存里的 Yjs 文档，只能单副本
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shadecn-learning
  template:
    metadata:
      labels:
        app: shadecn-learning
    spec:
      # 画布 agent 的 k8s 沙箱驱动用它调 API：只在 dev 有 pods 的 create/get/list/watch/delete 和 pods/log 的 get
      # （k8s/agent-sandbox.yaml，和这份一起由 ArgoCD 同步，SA 先于 Deployment 建好）
      serviceAccountName: shadecn-learning
      # 只用 arm64 节点：CI 只构建 arm64 镜像（ci/workflow-template.yaml 的 platforms），调度到 amd64 节点会拉不到镜像
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: shadecn-learning
          image: 192.168.68.95:31443/apps/shadecn-learning:359acc1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # SQLite 落在挂载卷上（库文件 = $DATA_DIR/app.db）
            #
            # 换 PostgreSQL：这三样一起改 ——
            #   1. 镜像要用 DB_PROVIDER=postgresql 构建（产物绑定 provider，见 docs/12）；
            #   2. 这里删掉 DATA_DIR，连同下面的 volumeMounts / volumes 和 PVC；
            #   3. DATABASE_URL 放进 shadecn-learning-auth 这个 Secret（连接串带密码，不能写明文 env）。
            # replicas 仍然只能是 1：Yjs 文档还在进程内存里。
            - name: DATA_DIR
              value: /app/data
            # 对外地址，用来拼 redirect_uri；必须和 Keycloak client 里配的一致
            - name: APP_ORIGIN
              value: https://demo.fyl080801.uk
            # 多域名访问时把每个对外域名都列进来（逗号分隔），APP_ORIGIN 自动在内。
            # 配上之后 redirect_uri / CORS / WebSocket Origin / 分享链接都按访问的
            # 域名走；名单外的 Host 回落 APP_ORIGIN。每个域名的 /api/auth/callback
            # 都要加进 Keycloak client 的 Valid redirect URIs。
            # - name: APP_ORIGINS
            #   value: https://demo.fyl080801.uk,https://demo.internal.fyl080801.uk
            - name: KEYCLOAK_ISSUER
              value: https://keycloak.fyl080801.uk/realms/master
            - name: KEYCLOAK_CLIENT_ID
              value: sample
            - name: KEYCLOAK_SCOPE
              value: openid profile email
            # 画布资源单个文件上限（MB），分片上传开始时校验；单片大小另由 ingress 的 proxy-body-size 放行
            - name: S3_MAX_UPLOAD_MB
              value: "500"
            # —— 画布 agent 的沙箱：每一轮在 dev 里建一个 Pod 跑 runner（docs/22 §7.5）——
            # 沙箱 Pod 和 gitea 等别的服务共用 dev：dev 没有 Pod Security，服务端能建什么样的 Pod 由
            # k8s/variants/agent-sandbox-vap.yaml（集群级，人工 apply）限死；它不在时启动自检不通过、agent 不启用。
            # 模型（AGENT_PROVIDER / AGENT_MODEL / AGENT_BASE_URL / AGENT_API / AGENT_IMAGE_INPUT / AGENT_API_KEY / AGENT_TOKEN_SECRET）
            # **不要写在这里**：它们来自下面 envFrom 的 shadecn-learning-agent（ConfigMap + Secret，带外资源，docs/12 §3.3），
            # 而 env 优先于 envFrom —— 在这里写一个就把那边的值盖掉了。没配 / 空值 = agent 未启用。
            - name: AGENT_SANDBOX
              value: k8s
            # F14：一轮的令牌和网关登记只在发起它的那个副本的内存里，runner 必须直连这个 Pod ——
            # 网关地址默认 http://$POD_IP:$PORT。不要改成 Service 的地址（多副本时会被分到别的副本，一律 401）
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AGENT_SANDBOX_K8S_NAMESPACE
              value: dev
            # 沙箱镜像和服务端同一个 tag、同一次构建：CI 写回 tag 时这一行和上面的 image 一起改（ci/workflow-template.yaml）
            - name: AGENT_SANDBOX_IMAGE
              value: 192.168.68.95:31443/apps/shadecn-agent-sandbox:359acc1
            # 沙箱 Pod 拉镜像用 dev 里现成的这个（kubelet 用；服务端没有读 Secret 的权限，也不需要）
            - name: AGENT_SANDBOX_K8S_PULL_SECRET
              value: harbor-pull-secret
            # tag 是提交 hash、不会被覆盖：节点上有就不再去仓库问一次
            - name: AGENT_SANDBOX_K8S_PULL_POLICY
              value: IfNotPresent
            # 沙箱镜像也只有 arm64
            - name: AGENT_SANDBOX_K8S_NODE_SELECTOR
              value: kubernetes.io/arch=arm64
          envFrom:
            - secretRef:
                name: shadecn-learning-auth
            # 画布 agent 的模型配置（带外资源，不归 ArgoCD，同 shadecn-learning-auth；docs/12 §3.3）：
            # 非密钥项在 ConfigMap、key 在 Secret。optional：被删了也不挡 Pod 启动（agent 只是未启用）。
            # envFrom 只在容器启动时读一次：改完要 kubectl -n dev rollout restart deploy/shadecn-learning
            - configMapRef:
                name: shadecn-learning-agent
                optional: true
            - secretRef:
                name: shadecn-learning-agent
                optional: true
            # 画布资源上传（带外资源，docs/12 §3.3）：ConfigMap 里是 S3_ENDPOINT / S3_INTERNAL_ENDPOINT / S3_REGION / S3_BUCKET，
            # Secret 里是 S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY。空值 = 不配（地址 / region 走默认值；桶和两项凭据缺一个 = 上传关闭）。
            # S3_KEY_PREFIX 刻意不在里面：空串的意思是「桶根」，和不配（canvas）不一样。
            # env 里只留 S3_MAX_UPLOAD_MB，别的 S3_* 不要写在 env（会盖掉这里）。改完同样要 rollout restart
            - configMapRef:
                name: shadecn-learning-s3
                optional: true
            - secretRef:
                name: shadecn-learning-s3
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 启动要先跑 node server/db-sync.js（表结构对齐，无迁移历史），给足冷启动时间
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
          # readiness 走**深**探针：数据库或 Redis 不通就把这个 Pod 从 endpoints 摘掉，
          # 别再往它送新请求。liveness 和 startup 仍用浅的 /api/health ——
          # 重启治不了数据库故障，只会把一个还握着未落库内容的进程杀掉，
          # 然后在 CrashLoopBackOff 里反复重启，把故障放大一圈（见 server/routes/health.ts）
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 10
            # 比服务端自己那道 2s 依赖探测超时宽一点，让**服务端先超时** ——
            # 这样失败原因会落进日志（探针先超时的话只有一句 kubelet 的 timeout）
            timeoutSeconds: 3
          # preStop 先睡 5 秒再让 SIGTERM 进来。k8s 里**摘 endpoint 和发 SIGTERM 是并行的**，
          # 不睡这一下，正在死的 Pod 还会接到新的 WebSocket 握手 ——
          # 那些连接一建立就会被随后的 closeConnections() 掐掉。
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
      # 退出要给足时间：SIGTERM 之后进程要断开所有协作连接、把每个房间的 Y.Doc
      # 落库、再把写队列排空（内容的事实源是内存，见 server/index.ts 的 shutdown）。
      # 默认的 30s 在房间多或数据库慢的时候不够，超时会被 SIGKILL —— 那比不落库还糟：
      # 既没写进去，也没干净退出。落库那段自己还有 20s 的上限，两者要对得上。
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shadecn-learning-data
      imagePullSecrets:
        - name: harbor-pull-secret
