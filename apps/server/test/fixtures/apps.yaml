# 集成测试用的应用表（docs/29 §3.3）。上游请求都被测试里的 fetch 截住，不会真的发出去。
providers:
  local-llm:
    type: ollama
  ark:
    type: ark
    apiKey: $TEST_APPS_ARK_KEY
    pollIntervalMs: 20
apps:
  chat:
    title: 测试对话
    provider: local-llm
    operation: chat
    model: qwen3
  seedream:
    title: 测试文生图
    provider: ark
    operation: image
    model: doubao-seedream-5-0-pro-260628
  seedance:
    title: 测试视频
    provider: ark
    operation: video
    model: doubao-seedance-2-0-260128
