# 服务端配置文件示例（docs/28 §3.3）。复制成 server.config.yaml（或 .yml / .json）后按需改，放在应用根目录
# （源码运行是仓库根，构建产物 / 容器里是进程 cwd）。
#
# - 分层：server.config.<NODE_ENV>.yaml（production / development）叠在它上面，对象逐键合并、数组整个替换；
# - SERVER_CONFIG=a.yaml,b.yaml 显式指定文件（按顺序叠，容器里指到挂进来的 ConfigMap），给了就不再自动找；
# - 环境变量（含 .env）优先于文件：每一项都有对应的环境变量，写在行尾注释里，含义见 .env.example；
# - 写了 schema 里没有的键、或类型不对，启动直接失败并列出全部问题；
# - 密钥（sessionSecret、各 clientSecret、secretAccessKey、apiKey）可以写在这里，但生产上应当走环境变量 / Secret。
#
# 下面全部是可选项，不写 = 用默认值。

server:
  # port: 3000                 # PORT
  # host: 127.0.0.1            # HOST
  # roles: [web, collab, agent]  # SERVER_ROLES，不写 = 全部角色一个进程（docs/28 §3.2）
  # instanceId: web-1          # INSTANCE_ID
  # dataDir: data              # DATA_DIR
  # staticDir: output/public   # STATIC_DIR
  # origin: https://canvas.example.com  # APP_ORIGIN
  # origins:                   # APP_ORIGINS
  #   - https://canvas.example.com
  #   - https://canvas.internal.example.com

database:
  # provider: postgresql       # DB_PROVIDER：sqlite / postgresql
  # url: postgresql://user:pass@db:5432/shadecn  # DATABASE_URL

cluster:
  # mode: redis                # CLUSTER_MODE：single / redis
  # redisUrl: redis://redis:6379  # REDIS_URL
  # redisKeyPrefix: shadecn    # REDIS_KEY_PREFIX

log:
  # level: info                # LOG_LEVEL
  # format: json               # LOG_FORMAT：pretty / json
  # dir: logs                  # LOG_DIR
  # http: api                  # LOG_HTTP：api / all / off
  # slowMs: 1000               # LOG_SLOW_MS
  # slowQueryMs: 200           # LOG_SLOW_QUERY_MS

# 能力模块（模块清单 apps/server/modules.ts 里的每一个一节，键是模块名）。每节都有 enabled（环境变量 <模块名>_ENABLED）：
# false 关掉（启动日志和 /api/features 写明原因；被别的模块硬依赖的关掉会启动失败）；true / 不写 = 由模块自己判（缺配置照样不开）
modules:
  auth:
    # enabled: true            # AUTH_ENABLED（登录、会话；canvas 硬依赖它，关不得）
    # sessionSecret: change-me   # SESSION_SECRET
    # sessionTtl: 604800         # SESSION_TTL（秒）
    keycloak:
      # issuer: https://keycloak.example.com/realms/shadecn  # KEYCLOAK_ISSUER
      # clientId: shadecn        # KEYCLOAK_CLIENT_ID
      # clientSecret: ""         # KEYCLOAK_CLIENT_SECRET
      # scope: openid profile email  # KEYCLOAK_SCOPE
    github:
      # clientId: ""             # GITHUB_CLIENT_ID
      # clientSecret: ""         # GITHUB_CLIENT_SECRET
      # scope: read:user user:email  # GITHUB_SCOPE
  canvas:
    # enabled: true            # CANVAS_ENABLED（项目 / 画布；storage / collab / agent 都硬依赖它）
  collab:
    # enabled: true            # COLLAB_ENABLED（agent 在执行角色上硬依赖它）
  storage:
    # enabled: true            # STORAGE_ENABLED
    # endpoint: https://s3.example.com  # S3_ENDPOINT
    # internalEndpoint: http://minio.minio.svc.cluster.local:9000  # S3_INTERNAL_ENDPOINT
    # region: us-east-1        # S3_REGION
    # bucket: canvas           # S3_BUCKET
    # accessKeyId: ""          # S3_ACCESS_KEY_ID
    # secretAccessKey: ""      # S3_SECRET_ACCESS_KEY
    # maxUploadMb: 100         # S3_MAX_UPLOAD_MB
    # keyPrefix: canvas        # S3_KEY_PREFIX
  agent:
    # enabled: true            # AGENT_ENABLED
    # provider: anthropic      # AGENT_PROVIDER
    # model: claude-sonnet-4-6 # AGENT_MODEL
    # baseUrl: ""              # AGENT_BASE_URL
    # api: ""                  # AGENT_API：openai-completions / anthropic-messages
    # apiKey: ""               # AGENT_API_KEY（不写按提供方退回 ANTHROPIC_API_KEY 等环境变量）
    # imageInput: true         # AGENT_IMAGE_INPUT
    # contextWindow: 128000    # AGENT_CONTEXT_WINDOW
    # maxTokens: 8192          # AGENT_MAX_TOKENS
    # thinking: medium         # AGENT_THINKING
    # titleModel: default      # AGENT_TITLE_MODEL（off = 不生成）
    # maxOutputTokens: 16384   # AGENT_MAX_OUTPUT_TOKENS
    # modelsFile: data/agent-models.json  # AGENT_MODELS_FILE
    # tokenSecret: ""          # AGENT_TOKEN_SECRET
    # gatewayUrl: ""           # AGENT_GATEWAY_URL
    # grantMarginMs: 60000     # AGENT_GRANT_MARGIN_MS
    # leaseTtlMs: 30000        # AGENT_LEASE_TTL_MS
    # runIdleTimeoutMs: 120000 # AGENT_RUN_IDLE_TIMEOUT_MS
    # runTotalTimeoutMs: 1800000  # AGENT_RUN_TOTAL_TIMEOUT_MS
    sandbox:
      # driver: process        # AGENT_SANDBOX：process / oci / k8s
      # exec: false            # AGENT_SANDBOX_EXEC
      # allowProcess: false    # AGENT_SANDBOX_ALLOW_PROCESS
      # image: shadecn-agent-sandbox:latest  # AGENT_SANDBOX_IMAGE
      # runtime: runsc         # AGENT_SANDBOX_RUNTIME
      # cpus: 1                # AGENT_SANDBOX_CPUS
      # memoryMib: 512         # AGENT_SANDBOX_MEMORY_MIB
      # pids: 128              # AGENT_SANDBOX_PIDS
      # diskMib: 512           # AGENT_SANDBOX_DISK_MIB
      oci:
        # socket: unix:///var/run/docker.sock  # AGENT_SANDBOX_OCI_SOCKET
        # network: bridge      # AGENT_SANDBOX_OCI_NETWORK
      k8s:
        # namespace: shadecn-agent-sandbox  # AGENT_SANDBOX_K8S_NAMESPACE
        # runtimeClass: gvisor # AGENT_SANDBOX_K8S_RUNTIME_CLASS
        # pullSecret: ""       # AGENT_SANDBOX_K8S_PULL_SECRET
        # pullPolicy: IfNotPresent  # AGENT_SANDBOX_K8S_PULL_POLICY
        # nodeSelector:        # AGENT_SANDBOX_K8S_NODE_SELECTOR
        #   kubernetes.io/arch: arm64
        # apiUrl: ""           # AGENT_SANDBOX_K8S_API_URL
        # tokenFile: ""        # AGENT_SANDBOX_K8S_TOKEN_FILE
        # caFile: ""           # AGENT_SANDBOX_K8S_CA_FILE
  notes:
    # enabled: true            # NOTES_ENABLED（笔记示例）
