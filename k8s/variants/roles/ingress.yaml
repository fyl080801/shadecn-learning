# 按角色拆分部署（REQ-MODULES，docs/28 §3.9）—— 同一个镜像，三个 Deployment，只差 SERVER_ROLES。
#
# ⚠️ 在 variants/ 下、不在 k8s/ 下：ArgoCD 只同步 k8s/ 这一层（没开 recurse）。现在线上是 k8s/deployment.yaml 的
# 单副本 + SQLite 形态；这一套要求集群里**有 Redis 和 PostgreSQL**（SERVER_ROLES 拆开时 CLUSTER_MODE 必须是 redis，
# 单副本下拆角色服务端会拒绝启动）。切换：把这个目录的五个文件放进 k8s/（替换 deployment.yaml / service.yaml / ingress.yaml），
# 删掉 PVC，提交。带外 apply 会被 ArgoCD 的 selfHeal 刷回去。
#
# 连接串在 Secret shadecn-learning-auth 里（DATABASE_URL / REDIS_URL / SESSION_SECRET / KEYCLOAK_CLIENT_SECRET），
# agent 的模型配置和对象存储照旧走带外的 ConfigMap + Secret（envFrom，optional）—— 三种角色用**同一份**：
# web 进程按自己的配置算 agent 面板的「已启用 / 模型名」，和 agent 进程对不上就会显示错（docs/28 §3.6 已知限制）。
#
# 按路径分流 —— 和 apps/server/routes/ownership.ts（服务端：不归本角色的路由 404）、apps/server/scripts/dev-route.mjs
# （本地 dev:cluster 的前置代理）是**同一张表**，改一处三处一起改（apps/server/test/agent/k8s-manifests.test.ts 对着测）。
# agent 网关不在这里：沙箱直连 agent Pod 的 IP。/api/health 走 web（每个角色都有，探针直连 Pod）。
#
# use-regex：/api/flows/<id>/doc 要正则。ingress-nginx 对同一个 host 开了 use-regex 之后所有 path 都按正则（前缀匹配）处理，
# 下面几条普通前缀照样成立。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadecn-learning
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01-cloudflare
    nginx.ingress.kubernetes.io/use-regex: "true"
    # /ws/collaboration 上的 Yjs 长连接：默认 60s 读超时会把闲置的协作连接掐掉
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # 画布资源上传：每个请求最多一片（8MiB）加 multipart 余量
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.fyl080801.uk
      secretName: shadecn-learning-tls
  rules:
    - host: demo.fyl080801.uk
      http:
        paths:
          - path: /ws/collaboration
            pathType: ImplementationSpecific
            backend:
              service:
                name: shadecn-learning-collab
                port:
                  number: 80
          - path: /api/collab
            pathType: ImplementationSpecific
            backend:
              service:
                name: shadecn-learning-collab
                port:
                  number: 80
          - path: /api/flows/[^/]+/doc/?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: shadecn-learning-collab
                port:
                  number: 80
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: shadecn-learning-web
                port:
                  number: 80
