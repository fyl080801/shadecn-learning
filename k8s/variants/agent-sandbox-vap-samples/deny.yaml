# ValidatingAdmissionPolicy（k8s/variants/agent-sandbox-vap.yaml）的反例：每一份只比 allow.yaml 多一处违规，
# 注解 shadecn.agent/denied-by 写着它该被哪几条规则拒（规则名 = VAP message 开头的 [规则名]）。
#
#   kubectl create --dry-run=server --as=system:serviceaccount:dev:shadecn-learning -f k8s/variants/agent-sandbox-vap-samples/deny.yaml 2>&1 \
#     | grep -E "created|denied request"
#   # 期望：21 行 denied request，0 行 created（一行 created 就是那条规则没生效）
#
# 集群里的拒绝原因可能和注解不完全一样：例如 sa-token 那一份，ServiceAccount 准入会先往里注入 projected token 卷，
# 于是 [emptydir-only] 也会命中 —— 只要被拒就对。
---
apiVersion: v1
kind: Pod
metadata:
  name: vap-deny-secret-volume
  namespace: dev
  labels:
    shadecn.agent/managed: "true"
  annotations:
    shadecn.agent/denied-by: emptydir-only
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  nodeSelector:
    kubernetes.io/arch: arm64
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: runner
      image: "192.168.68.95:31443/apps/shadecn-agent-sandbox:vap-check"
      command: [node, "-e", "0"]
      env:
        - name: SHADECN_WORKDIR
          value: /work/run
      workingDir: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir:
        medium: Memory
        sizeLimit: "64Mi"
    - name: leak
      secret:
        secretName: gitea-db
---
