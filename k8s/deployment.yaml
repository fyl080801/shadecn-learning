apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shadecn-learning-data
  namespace: dev
spec:
  # 集群里 local-path 和 nfs-homenas 都标了 default，必须显式指定
  storageClassName: nfs-homenas
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 注意：Secret 故意不放在 git 里（ArgoCD 开了 selfHeal，会拿仓库里的占位值把真值刷掉）。
# 它是带外创建的，用 .env 里的值：
#   set -a; . ./.env; set +a
#   kubectl -n dev create secret generic shadecn-learning-auth \
#     --from-literal=KEYCLOAK_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" \
#     --from-literal=SESSION_SECRET="$SESSION_SECRET" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadecn-learning
  namespace: dev
  labels:
    app: shadecn-learning
spec:
  # SQLite 单文件 + 内存里的 Yjs 文档，只能单副本
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shadecn-learning
  template:
    metadata:
      labels:
        app: shadecn-learning
    spec:
      containers:
        - name: shadecn-learning
          image: 192.168.68.95:31443/apps/shadecn-learning:eb3b64a
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # SQLite 落在挂载卷上（库文件 = $DATA_DIR/app.db）
            #
            # 换 PostgreSQL：这三样一起改 ——
            #   1. 镜像要用 DB_PROVIDER=postgresql 构建（产物绑定 provider，见 docs/12）；
            #   2. 这里删掉 DATA_DIR，连同下面的 volumeMounts / volumes 和 PVC；
            #   3. DATABASE_URL 放进 shadecn-learning-auth 这个 Secret（连接串带密码，不能写明文 env）。
            # replicas 仍然只能是 1：Yjs 文档还在进程内存里。
            - name: DATA_DIR
              value: /app/data
            # 对外地址，用来拼 redirect_uri；必须和 Keycloak client 里配的一致
            - name: APP_ORIGIN
              value: https://demo.fyl080801.uk
            - name: KEYCLOAK_ISSUER
              value: https://keycloak.fyl080801.uk/realms/master
            - name: KEYCLOAK_CLIENT_ID
              value: sample
            - name: KEYCLOAK_SCOPE
              value: openid profile email
          envFrom:
            - secretRef:
                name: shadecn-learning-auth
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 启动要先跑 prisma db push（结构对齐，无迁移历史），给足冷启动时间
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shadecn-learning-data
      imagePullSecrets:
        - name: harbor-pull-secret
