# 跑一次流水线。用 create（不是 apply）—— 名字是 generateName 生成的，每次都是新的一条：
#
#   kubectl -n dev create -f ci/run.yaml
#
# 构建别的分支就改下面的 gitRevision（不改则用模板里的默认值 master）。
# 集群里还有 Argo Workflows 的 UI，Submit new workflow 选 shadecn-learning-cicd 是等价的。
#
# 注意：push 到 gitea 的 master **已经会自动起构建**了 —— .gitea/workflows/cicd.yaml 里的
# Gitea Actions 会提交一条和这里等价的 Workflow（只是 gitRevision 跟着被 push 的分支）。
# 这一条留作兜底入口：Actions 或 runner 出问题、或者要构别的分支时用。改这里的 nodeSelector /
# 参数记得看一眼 cicd.yaml 里那份 heredoc。整条链路见 docs/12-deployment.md §4。
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: shadecn-learning-cicd-
  namespace: dev
spec:
  workflowTemplateRef:
    name: shadecn-learning-cicd
  # buildah 那步必须落在 amd64 节点上（arm64 那半靠 QEMU 模拟，反过来跑不动）
  nodeSelector:
    kubernetes.io/arch: amd64
  arguments:
    parameters:
      - name: gitRevision
        value: master
      # 基础镜像。默认（模板里那个）是 Harbor 的 docker.io 代理缓存，缓存没填全时会发一份
      # 缺架构的 index，构建报 `no image found in image index for architecture "amd64"`。
      # **先重试**（缓存热了就好；Harbor 侧不用动，各组件都已经走出网代理了）。
      # 重试反复不过，再在这里换成一份不经代理缓存的引用：
      #   - Harbor 里自己存的多架构副本（推荐，彻底不依赖外网）
      #   - 或按 index digest 固定：…/docker.io/library/node@sha256:<index digest>
      # 换之前务必确认它**真的是多架构**，理由见 Dockerfile 顶部和 docs/12 §2.5.1。
      # - name: baseImage
      #   value: 192.168.68.95:31443/docker.io/library/node:22-alpine
